name: build-index

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build manifest
        run: node scripts/build-index.mjs
      - name: Fail PR if manifest is stale
        if: github.event_name == 'pull_request'
        run: git diff --exit-code v1/index.json
      - name: Commit rebuilt manifest
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet v1/index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add v1/index.json
            git commit -m "chore: rebuild v1/index.json"
            git push
          fi
